[package]
name = "tidskvitto-core"
version = "0.1.1"
edition = "2021"
description = "Lokal kvittologik för Tidskvitto: kategorier, aggregering och uppskattning."
license = "UNLICENSED"
publish = false

[dependencies]
chrono = { version = "0.4", features = ["clock"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
